naftiko: 1.0.0-alpha2
info:
  label: Tufin SecureChange REST API — Users
  description: 'Tufin SecureChange REST API — Users. 1 operations. Lead operation: Get Users. Self-contained Naftiko capability
    covering one Tufin business surface.'
  tags:
  - Tufin
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TUFIN_API_KEY: TUFIN_API_KEY
capability:
  consumes:
  - type: http
    namespace: securechange-users
    baseUri: https://{tos_host}/securechangeworkflow/api/securechange
    description: Tufin SecureChange REST API — Users business capability. Self-contained, no shared references.
    resources:
    - name: users
      path: /users
      operations:
      - name: getusers
        method: GET
        description: Get Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: Filter by username
    authentication:
      type: basic
      username: '{{env.TUFIN_USER}}'
      password: '{{env.TUFIN_PASS}}'
  exposes:
  - type: rest
    namespace: securechange-users-rest
    port: 8080
    description: REST adapter for Tufin SecureChange REST API — Users. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: getusers
        description: Get Users
        call: securechange-users.getusers
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: securechange-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tufin SecureChange REST API — Users. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-users
      description: Get Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: securechange-users.getusers
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
