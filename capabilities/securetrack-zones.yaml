naftiko: 1.0.0-alpha2
info:
  label: Tufin SecureTrack REST API — Zones
  description: 'Tufin SecureTrack REST API — Zones. 1 operations. Lead operation: Get Security Zones. Self-contained Naftiko
    capability covering one Tufin business surface.'
  tags:
  - Tufin
  - Zones
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TUFIN_API_KEY: TUFIN_API_KEY
capability:
  consumes:
  - type: http
    namespace: securetrack-zones
    baseUri: https://{tos_host}/securetrack/api
    description: Tufin SecureTrack REST API — Zones business capability. Self-contained, no shared references.
    resources:
    - name: zones
      path: /zones
      operations:
      - name: getzones
        method: GET
        description: Get Security Zones
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.TUFIN_USER}}'
      password: '{{env.TUFIN_PASS}}'
  exposes:
  - type: rest
    namespace: securetrack-zones-rest
    port: 8080
    description: REST adapter for Tufin SecureTrack REST API — Zones. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/zones
      name: zones
      description: REST surface for zones.
      operations:
      - method: GET
        name: getzones
        description: Get Security Zones
        call: securetrack-zones.getzones
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: securetrack-zones-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tufin SecureTrack REST API — Zones. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-security-zones
      description: Get Security Zones
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: securetrack-zones.getzones
      outputParameters:
      - type: object
        mapping: $.
