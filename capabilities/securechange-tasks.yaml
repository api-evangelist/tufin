naftiko: 1.0.0-alpha2
info:
  label: Tufin SecureChange REST API — Tasks
  description: 'Tufin SecureChange REST API — Tasks. 3 operations. Lead operation: Get Ticket Tasks. Self-contained Naftiko
    capability covering one Tufin business surface.'
  tags:
  - Tufin
  - Tasks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TUFIN_API_KEY: TUFIN_API_KEY
capability:
  consumes:
  - type: http
    namespace: securechange-tasks
    baseUri: https://{tos_host}/securechangeworkflow/api/securechange
    description: Tufin SecureChange REST API — Tasks business capability. Self-contained, no shared references.
    resources:
    - name: tickets-ticketId-tasks
      path: /tickets/{ticketId}/tasks
      operations:
      - name: gettickettasks
        method: GET
        description: Get Ticket Tasks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ticketId
          in: path
          type: integer
          description: The unique identifier of the ticket
          required: true
    - name: tickets-ticketId-tasks-taskId
      path: /tickets/{ticketId}/tasks/{taskId}
      operations:
      - name: gettaskbyid
        method: GET
        description: Get Task By ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ticketId
          in: path
          type: integer
          description: The unique identifier of the ticket
          required: true
        - name: taskId
          in: path
          type: integer
          description: The unique identifier of the task
          required: true
      - name: updatetask
        method: PUT
        description: Update Task
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ticketId
          in: path
          type: integer
          description: The unique identifier of the ticket
          required: true
        - name: taskId
          in: path
          type: integer
          description: The unique identifier of the task
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.TUFIN_USER}}'
      password: '{{env.TUFIN_PASS}}'
  exposes:
  - type: rest
    namespace: securechange-tasks-rest
    port: 8080
    description: REST adapter for Tufin SecureChange REST API — Tasks. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/tickets/{ticketid}/tasks
      name: tickets-ticketid-tasks
      description: REST surface for tickets-ticketId-tasks.
      operations:
      - method: GET
        name: gettickettasks
        description: Get Ticket Tasks
        call: securechange-tasks.gettickettasks
        with:
          ticketId: rest.ticketId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tickets/{ticketid}/tasks/{taskid}
      name: tickets-ticketid-tasks-taskid
      description: REST surface for tickets-ticketId-tasks-taskId.
      operations:
      - method: GET
        name: gettaskbyid
        description: Get Task By ID
        call: securechange-tasks.gettaskbyid
        with:
          ticketId: rest.ticketId
          taskId: rest.taskId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatetask
        description: Update Task
        call: securechange-tasks.updatetask
        with:
          ticketId: rest.ticketId
          taskId: rest.taskId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: securechange-tasks-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tufin SecureChange REST API — Tasks. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-ticket-tasks
      description: Get Ticket Tasks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: securechange-tasks.gettickettasks
      with:
        ticketId: tools.ticketId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-task-id
      description: Get Task By ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: securechange-tasks.gettaskbyid
      with:
        ticketId: tools.ticketId
        taskId: tools.taskId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-task
      description: Update Task
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: securechange-tasks.updatetask
      with:
        ticketId: tools.ticketId
        taskId: tools.taskId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
