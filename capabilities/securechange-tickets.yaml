naftiko: 1.0.0-alpha2
info:
  label: Tufin SecureChange REST API — Tickets
  description: 'Tufin SecureChange REST API — Tickets. 5 operations. Lead operation: Get Tickets. Self-contained Naftiko capability
    covering one Tufin business surface.'
  tags:
  - Tufin
  - Tickets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TUFIN_API_KEY: TUFIN_API_KEY
capability:
  consumes:
  - type: http
    namespace: securechange-tickets
    baseUri: https://{tos_host}/securechangeworkflow/api/securechange
    description: Tufin SecureChange REST API — Tickets business capability. Self-contained, no shared references.
    resources:
    - name: tickets
      path: /tickets
      operations:
      - name: gettickets
        method: GET
        description: Get Tickets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by ticket status (Open, Resolved, Rejected, Cancelled, In Progress)
        - name: requester
          in: query
          type: string
          description: Filter by requester username
        - name: start_date
          in: query
          type: string
          description: Filter tickets created after this date (ISO 8601)
        - name: end_date
          in: query
          type: string
          description: Filter tickets created before this date (ISO 8601)
        - name: count
          in: query
          type: integer
          description: Number of tickets to return
        - name: start
          in: query
          type: integer
          description: Offset for pagination
      - name: createticket
        method: POST
        description: Create Ticket
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: tickets-ticketId
      path: /tickets/{ticketId}
      operations:
      - name: getticketbyid
        method: GET
        description: Get Ticket By ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ticketId
          in: path
          type: integer
          description: The unique identifier of the ticket
          required: true
      - name: updateticket
        method: PUT
        description: Update Ticket
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ticketId
          in: path
          type: integer
          description: The unique identifier of the ticket
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: tickets-ticketId-tasks
      path: /tickets/{ticketId}/tasks
      operations:
      - name: gettickettasks
        method: GET
        description: Get Ticket Tasks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ticketId
          in: path
          type: integer
          description: The unique identifier of the ticket
          required: true
    authentication:
      type: basic
      username: '{{env.TUFIN_USER}}'
      password: '{{env.TUFIN_PASS}}'
  exposes:
  - type: rest
    namespace: securechange-tickets-rest
    port: 8080
    description: REST adapter for Tufin SecureChange REST API — Tickets. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/tickets
      name: tickets
      description: REST surface for tickets.
      operations:
      - method: GET
        name: gettickets
        description: Get Tickets
        call: securechange-tickets.gettickets
        with:
          status: rest.status
          requester: rest.requester
          start_date: rest.start_date
          end_date: rest.end_date
          count: rest.count
          start: rest.start
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createticket
        description: Create Ticket
        call: securechange-tickets.createticket
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tickets/{ticketid}
      name: tickets-ticketid
      description: REST surface for tickets-ticketId.
      operations:
      - method: GET
        name: getticketbyid
        description: Get Ticket By ID
        call: securechange-tickets.getticketbyid
        with:
          ticketId: rest.ticketId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateticket
        description: Update Ticket
        call: securechange-tickets.updateticket
        with:
          ticketId: rest.ticketId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tickets/{ticketid}/tasks
      name: tickets-ticketid-tasks
      description: REST surface for tickets-ticketId-tasks.
      operations:
      - method: GET
        name: gettickettasks
        description: Get Ticket Tasks
        call: securechange-tickets.gettickettasks
        with:
          ticketId: rest.ticketId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: securechange-tickets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tufin SecureChange REST API — Tickets. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-tickets
      description: Get Tickets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: securechange-tickets.gettickets
      with:
        status: tools.status
        requester: tools.requester
        start_date: tools.start_date
        end_date: tools.end_date
        count: tools.count
        start: tools.start
      outputParameters:
      - type: object
        mapping: $.
    - name: create-ticket
      description: Create Ticket
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: securechange-tickets.createticket
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-ticket-id
      description: Get Ticket By ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: securechange-tickets.getticketbyid
      with:
        ticketId: tools.ticketId
      outputParameters:
      - type: object
        mapping: $.
    - name: update-ticket
      description: Update Ticket
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: securechange-tickets.updateticket
      with:
        ticketId: tools.ticketId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-ticket-tasks
      description: Get Ticket Tasks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: securechange-tickets.gettickettasks
      with:
        ticketId: tools.ticketId
      outputParameters:
      - type: object
        mapping: $.
