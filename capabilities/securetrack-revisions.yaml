naftiko: 1.0.0-alpha2
info:
  label: Tufin SecureTrack REST API — Revisions
  description: 'Tufin SecureTrack REST API — Revisions. 1 operations. Lead operation: Get Device Revisions. Self-contained
    Naftiko capability covering one Tufin business surface.'
  tags:
  - Tufin
  - Revisions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TUFIN_API_KEY: TUFIN_API_KEY
capability:
  consumes:
  - type: http
    namespace: securetrack-revisions
    baseUri: https://{tos_host}/securetrack/api
    description: Tufin SecureTrack REST API — Revisions business capability. Self-contained, no shared references.
    resources:
    - name: devices-deviceId-revisions
      path: /devices/{deviceId}/revisions
      operations:
      - name: getdevicerevisions
        method: GET
        description: Get Device Revisions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: deviceId
          in: path
          type: integer
          description: The unique identifier of the device
          required: true
    authentication:
      type: basic
      username: '{{env.TUFIN_USER}}'
      password: '{{env.TUFIN_PASS}}'
  exposes:
  - type: rest
    namespace: securetrack-revisions-rest
    port: 8080
    description: REST adapter for Tufin SecureTrack REST API — Revisions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/devices/{deviceid}/revisions
      name: devices-deviceid-revisions
      description: REST surface for devices-deviceId-revisions.
      operations:
      - method: GET
        name: getdevicerevisions
        description: Get Device Revisions
        call: securetrack-revisions.getdevicerevisions
        with:
          deviceId: rest.deviceId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: securetrack-revisions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Tufin SecureTrack REST API — Revisions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-device-revisions
      description: Get Device Revisions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: securetrack-revisions.getdevicerevisions
      with:
        deviceId: tools.deviceId
      outputParameters:
      - type: object
        mapping: $.
