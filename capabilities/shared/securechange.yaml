naftiko: "1.0.0-alpha1"

info:
  label: "Tufin SecureChange API"
  description: >-
    Tufin SecureChange REST API for automating security policy change workflows.
    Provides ticket creation, workflow management, task approval, and ITSM integration
    for end-to-end firewall change automation across network infrastructure.
  tags:
    - Change Management
    - ITSM Integration
    - Policy Changes
    - Ticketing
    - Workflow Automation
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      SECURECHANGE_USERNAME: SECURECHANGE_USERNAME
      SECURECHANGE_PASSWORD: SECURECHANGE_PASSWORD

capability:
  consumes:
    - type: http
      namespace: securechange
      baseUri: https://{tos_host}/securechangeworkflow/api/securechange
      description: "Tufin SecureChange REST API for security policy change workflows"
      authentication:
        type: basic
        username: "{{SECURECHANGE_USERNAME}}"
        password: "{{SECURECHANGE_PASSWORD}}"
      resources:
        - name: tickets
          path: /tickets
          description: "Security change tickets"
          operations:
            - name: get-tickets
              method: GET
              description: "Retrieve security change tickets with optional status filtering"
              inputParameters:
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by ticket status"
                - name: count
                  in: query
                  type: integer
                  required: false
                  description: "Number of tickets to return"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-ticket
              method: POST
              description: "Submit a new security change ticket"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  subject: "{{tools.subject}}"
                  description: "{{tools.description}}"
                  priority: "{{tools.priority}}"
                  workflow: "{{tools.workflow}}"

        - name: ticket
          path: /tickets/{ticketId}
          description: "Single change ticket"
          operations:
            - name: get-ticket-by-id
              method: GET
              description: "Retrieve a specific security change ticket"
              inputParameters:
                - name: ticketId
                  in: path
                  type: integer
                  required: true
                  description: "Ticket identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-ticket
              method: PUT
              description: "Update an existing change ticket"
              inputParameters:
                - name: ticketId
                  in: path
                  type: integer
                  required: true
                  description: "Ticket identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  subject: "{{tools.subject}}"
                  description: "{{tools.description}}"

        - name: ticket-tasks
          path: /tickets/{ticketId}/tasks
          description: "Workflow tasks for a ticket"
          operations:
            - name: get-ticket-tasks
              method: GET
              description: "Retrieve all workflow tasks for a ticket"
              inputParameters:
                - name: ticketId
                  in: path
                  type: integer
                  required: true
                  description: "Ticket identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: ticket-task
          path: /tickets/{ticketId}/tasks/{taskId}
          description: "Single workflow task"
          operations:
            - name: get-task-by-id
              method: GET
              description: "Retrieve a specific workflow task"
              inputParameters:
                - name: ticketId
                  in: path
                  type: integer
                  required: true
                  description: "Ticket identifier"
                - name: taskId
                  in: path
                  type: integer
                  required: true
                  description: "Task identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-task
              method: PUT
              description: "Update a workflow task (approve, reject, or provide implementation)"
              inputParameters:
                - name: ticketId
                  in: path
                  type: integer
                  required: true
                  description: "Ticket identifier"
                - name: taskId
                  in: path
                  type: integer
                  required: true
                  description: "Task identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  status: "{{tools.status}}"
                  comment: "{{tools.comment}}"

        - name: workflow-definitions
          path: /workflow_definitions
          description: "Workflow template definitions"
          operations:
            - name: get-workflow-definitions
              method: GET
              description: "Retrieve all workflow definitions configured in SecureChange"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: securechange-api
      resources:
        - path: /v1/tickets
          name: tickets
          description: "Security change tickets"
          operations:
            - method: GET
              name: get-tickets
              description: "List security change tickets"
              call: "securechange.get-tickets"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-ticket
              description: "Submit a new change ticket"
              call: "securechange.create-ticket"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/tickets/{ticketId}
          name: ticket
          description: "Single change ticket"
          operations:
            - method: GET
              name: get-ticket
              description: "Get change ticket by ID"
              call: "securechange.get-ticket-by-id"
              with:
                ticketId: "rest.ticketId"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/workflows
          name: workflow-definitions
          description: "Workflow template definitions"
          operations:
            - method: GET
              name: get-workflow-definitions
              description: "List workflow definitions"
              call: "securechange.get-workflow-definitions"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: securechange-mcp
      transport: http
      tools:
        - name: list-tickets
          description: "List security change tickets with optional status filtering"
          hints:
            readOnly: true
            openWorld: true
          call: "securechange.get-tickets"
          with:
            status: "tools.status"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-ticket
          description: "Submit a new security policy change ticket to SecureChange workflow"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "securechange.create-ticket"
          with:
            subject: "tools.subject"
            description: "tools.description"
            priority: "tools.priority"
            workflow: "tools.workflow"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-ticket
          description: "Get details for a specific security change ticket"
          hints:
            readOnly: true
            openWorld: false
          call: "securechange.get-ticket-by-id"
          with:
            ticketId: "tools.ticketId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-ticket-tasks
          description: "Get workflow tasks for a security change ticket"
          hints:
            readOnly: true
            openWorld: false
          call: "securechange.get-ticket-tasks"
          with:
            ticketId: "tools.ticketId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: approve-task
          description: "Approve or update a workflow task in a security change ticket"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "securechange.update-task"
          with:
            ticketId: "tools.ticketId"
            taskId: "tools.taskId"
            status: "tools.status"
            comment: "tools.comment"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-workflow-definitions
          description: "List available workflow templates in SecureChange"
          hints:
            readOnly: true
            openWorld: true
          call: "securechange.get-workflow-definitions"
          outputParameters:
            - type: object
              mapping: "$."
