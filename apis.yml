- name: Tufin SecureTrack GraphQL API
  description: >-
    GraphQL API for the Tufin Orchestration Suite providing flexible querying capabilities for security
    policy data, network topology, and compliance information. Uses OAuth2 authentication and supports
    complex nested queries across SecureTrack resources including devices, policies, rules, and topology.
  image: https://www.tufin.com/themes/custom/tufin/logo.svg
  humanURL: https://forum.tufin.com/support/kc/latest/Content/ST2/API/API_Introduction.htm
  baseURL: https://{tos_ip}/v2/api/sync/graphql
  tags:
  - GraphQL
  - Network Topology
  - OAuth2
  - Policy Analysis
  - Security Data
  properties:
