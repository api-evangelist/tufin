  - url: graphql/tufin-graphql.md
    type: GraphQL
- name: Tufin SecureCloud API
  description: >-
    REST API for Tufin SecureCloud, the cloud-native security policy management platform. Provides endpoints
    for managing cloud accounts, applications, assets, Kubernetes clusters, and security policies across
    AWS, Azure, and GCP environments. Enables cloud security posture management (CSPM) and Kubernetes
    network policy enforcement through API integration.
  image: https://www.tufin.com/themes/custom/tufin/logo.svg
  humanURL: https://www.tufin.com/tufin-orchestration-suite/securecloud
  baseURL: https://{account}.securecloud.tufin.io/api/v1
