- name: Tufin SecureApp API
  description: >-
    API for application-centric security policy management and micro-segmentation. SecureApp enables teams
    to manage security policies at the application level, define connectivity requirements, and automate
    policy changes for application deployments.
  image: https://www.tufin.com/themes/custom/tufin/logo.svg
  humanURL: https://www.tufin.com/products/secureapp
  baseURL: https://{tos_host}/securechangeworkflow/api
