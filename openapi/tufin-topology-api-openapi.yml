openapi: 3.2.0
info:
  title: Tufin SecureTrack REST Topology API
  description: The Tufin SecureTrack REST API enables programmatic access to network security policy management across multi-vendor firewall infrastructure. It provides endpoints for querying network devices, analyzing firewall rules and policies, performing network topology analysis, executing path queries, managing rule documentation, and retrieving compliance and risk analysis data. Authentication uses HTTP Basic Auth with Tufin Orchestration Suite (TOS) credentials.
  version: R25-2
  contact:
    name: Tufin Support
    url: https://www.tufin.com/support
  license:
    name: Tufin Terms of Use
    url: https://www.tufin.com/terms-of-use
servers:
- url: https://{tos_host}/securetrack/api
  description: Tufin Orchestration Suite Server
  variables:
    tos_host:
      description: Hostname or IP address of the TOS server
      default: tufin.example.com
tags:
- name: Topology
  description: Network topology analysis and path queries
paths:
  /topology/path:
    get:
      operationId: getTopologyPath
      summary: Get Network Path
      description: Query the network topology to determine whether traffic is permitted between source and destination endpoints, and which devices are traversed.
      tags:
      - Topology
      security:
      - basicAuth: []
      parameters:
      - name: src
        in: query
        required: true
        description: Source IP address or CIDR range
        schema:
          type: string
      - name: dst
        in: query
        required: true
        description: Destination IP address or CIDR range
        schema:
          type: string
      - name: service
        in: query
        description: Service (protocol/port, e.g., tcp/443)
        schema:
          type: string
      responses:
        '200':
          description: Path analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyPath'
  /topology/path/image:
    get:
      operationId: getTopologyPathImage
      summary: Get Topology Path Image
      description: Export a visualization of the network path as a PNG image.
      tags:
      - Topology
      security:
      - basicAuth: []
      parameters:
      - name: src
        in: query
        required: true
        description: Source IP address or CIDR range
        schema:
          type: string
      - name: dst
        in: query
        required: true
        description: Destination IP address or CIDR range
        schema:
          type: string
      responses:
        '200':
          description: Path topology image
          content:
            image/png:
              schema:
                type: string
                format: binary
  /topology/map:
    get:
      operationId: getTopologyMap
      summary: Get Topology Map
      description: Retrieve the full network topology map.
      tags:
      - Topology
      security:
      - basicAuth: []
      responses:
        '200':
          description: Topology map data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyMap'
components:
  schemas:
    TopologyPath:
      type: object
      description: Result of a network topology path query
      properties:
        traffic_allowed:
          type: boolean
          description: Whether traffic is allowed between source and destination
        is_fully_routed:
          type: boolean
          description: Whether a complete routed path exists
        device_info:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Device name
              id:
                type: integer
                description: Device ID
          description: Devices traversed in the path
    TopologyMap:
      type: object
      description: Network topology map data
      properties:
        nodes:
          type: array
          items:
            type: object
          description: Topology nodes (devices, subnets)
        edges:
          type: array
          items:
            type: object
          description: Topology connections between nodes
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using Tufin Orchestration Suite credentials. The authenticated user's TOS permissions apply to all API requests.
externalDocs:
  description: Tufin SecureTrack REST API Documentation
  url: https://forum.tufin.com/support/kc/latest/Content/Suite/RESTAPI/securetrack_api.htm
