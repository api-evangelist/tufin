specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Tufin
providerId: tufin
publisherName: Tufin
serviceCategory: API
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - Cloud Security
  - Compliance
  - Firewall Management
  - Network Security
  - Network Topology
  - Policy Orchestration
  - Risk Management
  - Security Policy Management
  - Zero Trust
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the Tufin API surface. Provides a FOCUS-aligned mapping for
  cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Tufin
  ServiceCategory: Developer Tools / API
  ProviderName: Tufin
  PublisherName: Tufin
  InvoiceIssuerName: Tufin
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: Tufin SecureTrack API
    baseURL: https://{tos_host}/securetrack/api
    tags:
      - Compliance
      - Firewall Rules
      - Network Devices
      - Network Topology
      - Policy Analysis
      - Risk Analysis
    serviceName: Tufin SecureTrack API
    serviceCategory: API
  - name: Tufin SecureChange API
    baseURL: https://{tos_host}/securechangeworkflow/api
    tags:
      - Approvals
      - Change Management
      - ITSM Integration
      - Policy Changes
      - Ticketing
      - Workflow Automation
    serviceName: Tufin SecureChange API
    serviceCategory: API
  - name: Tufin SecureApp API
    baseURL: https://{tos_host}/securechangeworkflow/api
    tags:
      - Application Security
      - Micro-Segmentation
      - Policy Management
      - Zero Trust
    serviceName: Tufin SecureApp API
    serviceCategory: API
  - name: Tufin SecureTrack GraphQL API
    baseURL: https://{tos_ip}/v2/api/sync/graphql
    tags:
      - GraphQL
      - Network Topology
      - OAuth2
      - Policy Analysis
      - Security Data
    serviceName: Tufin SecureTrack GraphQL API
    serviceCategory: API
  - name: Tufin SecureCloud API
    baseURL: https://{account}.securecloud.tufin.io/api/v1
    tags:
      - Cloud Security
      - CSPM
      - Kubernetes
      - Multi-Cloud
      - Policy Management
    serviceName: Tufin SecureCloud API
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
